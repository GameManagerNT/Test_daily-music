<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 🛡️ 第一層防禦：Content Security Policy (CSP) 限制未授權資源 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://via.placeholder.com;
    connect-src 'self' https://img.youtube.com;
    frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
    object-src 'none';
    base-uri 'self';
  ">
  
  <title>每日一推薦</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 全螢幕背景 Canvas -->
  <canvas id="snow-canvas"></canvas>

  <main class="container">
    <header>
      <h1 id="main-title">🎵 每日一推薦 🎵</h1>
    </header>

    <!-- 當天推薦區塊 -->
    <section class="today-card">
      <h2 id="today-title">載入中...</h2>
      <p id="today-artist" class="artist"></p>
      
      <!-- 純圖片封面區塊 -->
      <div class="cover-wrapper">
        <a id="today-cover-link" href="#" target="_blank" rel="noopener noreferrer">
          <img id="today-cover" src="https://via.placeholder.com/400x225?text=Loading..." alt="歌曲封面">
        </a>
      </div>
      <span id="today-date" class="date-badge">YYYY-MM-DD</span>
    </section>

    <!-- 歷史清單區塊 -->
    <section class="history-section">
      <div class="history-header">
        <h3>📜 往期推薦歷史</h3>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜尋歌名或歌手..." aria-label="搜尋歌名或歌手" />
        </div>
      </div>

      <ul id="history-list">
        <!-- 動態渲染歷史紀錄 -->
      </ul>

      <!-- 分頁按鈕區塊 -->
      <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)" disabled>← 上一頁</button>
        <span id="page-info">第 1 頁</span>
        <button id="next-btn" onclick="changePage(1)" disabled>下一頁 →</button>
      </div>
    </section>
  </main>

  <!-- 頁尾製作人資訊 -->
  <footer class="footer-credits">
    Designed & Developed by <strong>GameManagerNT</strong> © 2026
  </footer>

  <script src="script.js"></script>
</body>
</html>
